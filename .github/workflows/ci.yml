# Docker images for livedemo-ai-api (monq worker, API).
# Note: the monq-base image is built and pushed manually — not part of this CI.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   CI_MINE_USERNAME   - Docker Container Registry username
#   CI_MINE_PASSWORD   - Docker Container Registry password (token or password)
#   GIT_SSH_KEY        - Private SSH key for GitHub (monq git dependency)

name: CI

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  DOCKER_IMAGE_PREFIX: docker.io/livedemo/livedemo-ai-api

jobs:
# Mirrors: build-livedemo-ai-api-monq-image (automatic on develop)
  build-ai-api-monq-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH for Docker build (private Git deps)
        env:
          GIT_SSH_KEY: ${{ secrets.GIT_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$GIT_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Log in to Docker Container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.CI_MINE_USERNAME }}
          password: ${{ secrets.CI_MINE_PASSWORD }}

      - name: Build and push livedemo-ai-api monq image
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          docker build -f ./tools/docker/Dockerfile_monq -t "${{ env.DOCKER_IMAGE_PREFIX }}:monq-latest" .
          docker tag "${{ env.DOCKER_IMAGE_PREFIX }}:monq-latest" "${{ env.DOCKER_IMAGE_PREFIX }}:monq-${TAG_SHA}"
          docker push "${{ env.DOCKER_IMAGE_PREFIX }}:monq-${TAG_SHA}"
          docker push "${{ env.DOCKER_IMAGE_PREFIX }}:monq-latest"

  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH agent (private Git deps)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GIT_SSH_KEY }}

      - name: Add github.com to known hosts
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
